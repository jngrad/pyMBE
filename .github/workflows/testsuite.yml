name: testsuite

on:
  push:
  pull_request:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    env:
      FI_PROVIDER: "^psm3,psm3;ofi_rxd"
      OMPI_MCA_mtl_ofi_provider_exclude: psm3
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        espresso:
          - version: "5.0-dev"
            eessi: ESPResSo/95f275aa2060714e5d5b6c36e39fd4a9b422eacf-foss-2023b
            upload_artifact: false
    name: ubuntu - ESPResSo ${{ matrix.espresso.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
      - name: Validate CITATION.cff
        uses: dieghernan/cff-validator@v3
        with:
          install-r: true # Ensure R is explicitly installed
      - name: Setup EESSI
        uses: eessi/github-action-eessi@v3
        with:
          eessi_stack_version: "2023.06"
      - name: Install dependencies
        uses: ./.github/actions/dependencies
        with:
          modules: |-
            ${{ matrix.espresso.eessi }}
          extra-python-packages: |-
            pdoc==15.0.3
            pylint==3.0.3
            coverage==7.4.4
      - name: Remote login configuration
        run: echo 'source "$BASH_ENV"' >> ~/.bash_profile
      - name: Remote login (for live debugging)
        uses: owenthereal/action-upterm@v1
        with:
          detached: true
          limit-access-to-actor: true
